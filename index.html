<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <meta name="description" content="Bản thử quản lý cây xăng với dữ liệu mẫu, lưu cục bộ trên thiết bị.">
  <title>Quản lý cây xăng · Bản thử</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="demo-strip"><span class="demo-dot"></span><strong>BẢN DÙNG THỬ</strong><span>Dữ liệu mẫu · lưu riêng trên trình duyệt này</span><button id="reset-demo" type="button">Đặt lại dữ liệu mẫu</button></div>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="Trang tổng quan">
      <span class="brand-mark">⛽</span><span><strong>Trạm Xanh</strong><small>Quản lý vận hành</small></span>
    </a>
    <div class="topbar-right"><span class="today-label" id="today-label"></span><label class="demo-role-label" for="demo-role">Chế độ thử</label><select class="demo-role-select" id="demo-role" aria-label="Vai trò mô phỏng"><option value="owner">Quản lý</option><option value="seller">Nhân viên</option></select><span class="avatar">DA</span><span class="user-name" id="demo-role-name">Quản lý demo</span></div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <p class="nav-caption">TỔNG QUAN</p>
      <button class="nav-item active" data-view="home" aria-label="Tổng quan" title="Tổng quan"><span aria-hidden="true">⌂</span><small class="nav-label">Tổng quan</small></button>
      <p class="nav-caption">GIAO DỊCH</p>
      <button class="nav-item" data-view="sale" aria-label="Bán cho xe công ty" title="Bán cho xe công ty"><span aria-hidden="true">↗</span><small class="nav-label">Bán cho xe</small></button>
      <button class="nav-item" data-view="pump-fill" data-manager-only hidden aria-label="Nạp vào trụ" title="Nạp vào trụ"><span aria-hidden="true">↓</span><small class="nav-label">Nạp trụ</small></button>
      <button class="nav-item" data-view="closing" data-manager-only hidden aria-label="Chốt trụ cuối ngày" title="Chốt trụ cuối ngày"><span aria-hidden="true">◷</span><small class="nav-label">Chốt trụ</small></button>
      <button class="nav-item" data-view="purchase" data-manager-only hidden aria-label="Nhập nhiên liệu" title="Nhập nhiên liệu"><span aria-hidden="true">↙</span><small class="nav-label">Nhập hàng</small></button>
      <button class="nav-item" data-view="payments" data-manager-only hidden aria-label="Thu và chi" title="Thu và chi"><span aria-hidden="true">⇄</span><small class="nav-label">Thu / chi</small></button>
      <p class="nav-caption" data-manager-only hidden>THEO DÕI</p>
      <button class="nav-item" data-view="reports" data-manager-only hidden aria-label="Sổ kho và công nợ" title="Sổ kho và công nợ"><span aria-hidden="true">▤</span><small class="nav-label">Sổ kho</small></button>
      <button class="nav-item" data-view="catalog" data-manager-only hidden aria-label="Danh mục và giá bán" title="Danh mục và giá bán"><span aria-hidden="true">☷</span><small class="nav-label">Danh mục</small></button>
      <div class="sidebar-note"><span class="lock-icon">▣</span><strong>Thử an toàn</strong><p>Không có tài khoản thật hay máy chủ. Vai trò nhân viên chỉ mô phỏng giao diện; dữ liệu nằm trong trình duyệt này.</p></div>
      <footer>Trạm Xanh <span>·</span> Demo 2026</footer>
    </aside>
    <main id="app" class="main-content" aria-live="polite"></main>
  </div>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
