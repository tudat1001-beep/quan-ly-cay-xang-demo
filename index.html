<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <meta name="description" content="Bản thử quản lý cây xăng với dữ liệu mẫu, lưu cục bộ trên thiết bị.">
  <title>Quản lý cây xăng · Bản thử</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="demo-strip"><span class="demo-dot"></span><strong>BẢN DÙNG THỬ</strong><span>Dữ liệu mẫu · lưu riêng trên trình duyệt này</span><button id="reset-demo" type="button">Đặt lại dữ liệu mẫu</button></div>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="Trang tổng quan">
      <span class="brand-mark">⛽</span><span><strong>Trạm Xanh</strong><small>Quản lý vận hành</small></span>
    </a>
    <div class="topbar-right"><span class="today-label" id="today-label"></span><span class="avatar" aria-hidden="true">QL</span><span class="user-name">Quản lý</span></div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <p class="nav-caption">TỔNG QUAN</p>
      <button class="nav-item active" data-view="home" aria-label="Tổng quan" title="Tổng quan"><span aria-hidden="true">⌂</span><small class="nav-label">Tổng quan</small></button>
      <p class="nav-caption">GIAO DỊCH</p>
      <button class="nav-item" data-view="sale" aria-label="Bán cho xe công ty" title="Bán cho xe công ty"><span aria-hidden="true">↗</span><small class="nav-label">Bán cho xe</small></button>
      <button class="nav-item" data-view="pump-fill" aria-label="Nạp vào trụ" title="Nạp vào trụ"><span aria-hidden="true">↓</span><small class="nav-label">Nạp trụ</small></button>
      <button class="nav-item" data-view="closing" aria-label="Chốt trụ cuối ngày" title="Chốt trụ cuối ngày"><span aria-hidden="true">◷</span><small class="nav-label">Chốt trụ</small></button>
      <button class="nav-item" data-view="purchase" aria-label="Nhập nhiên liệu" title="Nhập nhiên liệu"><span aria-hidden="true">↙</span><small class="nav-label">Nhập hàng</small></button>
      <button class="nav-item" data-view="payments" data-mobile-secondary aria-label="Thu và chi" title="Thu và chi"><span aria-hidden="true">⇄</span><small class="nav-label">Thu / chi</small></button>
      <p class="nav-caption">THEO DÕI</p>
      <button class="nav-item" data-view="reports" data-mobile-secondary aria-label="Sổ kho và công nợ" title="Sổ kho và công nợ"><span aria-hidden="true">▤</span><small class="nav-label">Sổ kho</small></button>
      <button class="nav-item" data-view="catalog" data-mobile-secondary aria-label="Danh mục và giá bán" title="Danh mục và giá bán"><span aria-hidden="true">☷</span><small class="nav-label">Danh mục</small></button>
      <button class="nav-item mobile-more-button" id="mobile-more" aria-label="Thêm chức năng" title="Thêm chức năng" aria-expanded="false" aria-controls="mobile-more-panel"><span aria-hidden="true">⋯</span><small class="nav-label">Thêm</small></button>
      <div class="sidebar-note"><span class="lock-icon">▣</span><strong>Một người dùng quản lý</strong><p>Bản thử không có đăng nhập thật. Dữ liệu chỉ lưu trong trình duyệt trên thiết bị này.</p></div>
      <footer>Trạm Xanh <span>·</span> Demo 2026</footer>
    </aside>
    <main id="app" class="main-content" aria-live="polite"></main>
  </div>
  <section class="mobile-more-panel" id="mobile-more-panel" role="dialog" aria-modal="false" aria-labelledby="mobile-more-title" hidden>
    <div class="mobile-more-heading"><h2 id="mobile-more-title">Chức năng khác</h2><button id="mobile-more-close" type="button" aria-label="Đóng">×</button></div>
    <div class="mobile-more-grid">
      <button type="button" data-view="payments" aria-label="Thu và chi"><span aria-hidden="true">⇄</span><small>Thu / chi</small></button>
      <button type="button" data-view="reports" aria-label="Sổ kho và công nợ"><span aria-hidden="true">▤</span><small>Sổ kho</small></button>
      <button type="button" data-view="catalog" aria-label="Danh mục và giá bán"><span aria-hidden="true">☷</span><small>Danh mục</small></button>
    </div>
  </section>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
